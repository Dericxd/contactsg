<div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4">
  <div class="w-full sm:w-auto flex-1">
    <app-search-input
      placeholder="Buscar por nombre o apellido..."
      (value)="query.set($event)"
      [debounceTime]="500"
      [initialValue]="query()"
    />
  </div>

  @if (canSeeDeleted()) {
    <div class="form-control shrink-0">
      <label class="label cursor-pointer gap-2 border border-base-300 rounded-lg px-3 py-1.5 bg-base-100 shadow-sm hover:bg-base-200 transition-colors">
        <span class="label-text text-xs font-semibold">Incluir eliminados</span>
        <input 
          type="checkbox" 
          [checked]="includeDeleted()" 
          (change)="toggleIncludeDeleted()" 
          class="checkbox checkbox-xs checkbox-warning" 
        />
      </label>
    </div>
  }
</div>

<app-staff-list
  [person]="staffResource.value() ?? []"
  [errorMessage]="staffResource.error()"
  [isEmpty]="staffResource.value()?.length === 0"
  [isLoading]="staffResource.isLoading()"
  (onDataChanged)="reloadData()"
/>
