<div class="flex flex-col sm:flex-row justify-between items-center gap-4 py-3 px-2 border-t border-base-200">
  <!-- Resumen de registros -->
  <div class="text-xs sm:text-sm text-base-content/70">
    @if (totalItems() > 0) {
      Mostrando <span class="font-semibold text-base-content">{{ startItem() }}</span> a
      <span class="font-semibold text-base-content">{{ endItem() }}</span> de
      <span class="font-semibold text-base-content">{{ totalItems() }}</span> registros
    } @else {
      No hay registros disponibles
    }
  </div>

  <!-- Controles: Selector de tamaño y Botonera de páginas -->
  <div class="flex items-center gap-3 flex-wrap justify-center">
    <!-- Selector de registros por página -->
    <div class="flex items-center gap-1.5 text-xs text-base-content/70">
      <span>Filas:</span>
      <select
        [value]="pageSize()"
        (change)="onPageSizeSelected($event)"
        class="select select-bordered select-xs"
      >
        @for (opt of pageSizeOptions(); track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </div>

    <!-- Botonera Join DaisyUI -->
    @if (totalPages() > 1) {
      <div class="join">
        <!-- Primera página -->
        <button
          type="button"
          class="join-item btn btn-xs sm:btn-sm"
          [disabled]="currentPage() <= 1"
          (click)="goToPage(1)"
          title="Primera página"
        >
          «
        </button>

        <!-- Página anterior -->
        <button
          type="button"
          class="join-item btn btn-xs sm:btn-sm"
          [disabled]="currentPage() <= 1"
          (click)="goToPage(currentPage() - 1)"
          title="Página anterior"
        >
          ‹
        </button>

        <!-- Páginas numeradas -->
        @for (p of visiblePages(); track p) {
          <button
            type="button"
            class="join-item btn btn-xs sm:btn-sm"
            [class.btn-primary]="p === currentPage()"
            [class.btn-active]="p === currentPage()"
            (click)="goToPage(p)"
          >
            {{ p }}
          </button>
        }

        <!-- Página siguiente -->
        <button
          type="button"
          class="join-item btn btn-xs sm:btn-sm"
          [disabled]="currentPage() >= totalPages()"
          (click)="goToPage(currentPage() + 1)"
          title="Página siguiente"
        >
          ›
        </button>

        <!-- Última página -->
        <button
          type="button"
          class="join-item btn btn-xs sm:btn-sm"
          [disabled]="currentPage() >= totalPages()"
          (click)="goToPage(totalPages())"
          title="Última página"
        >
          »
        </button>
      </div>
    }
  </div>
</div>
